# 1. Global / Root-Level Settings (Must be first)
# tag_prefix = "v"
from_latest_tag = false
ignore_merge_commits = false
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
pre_package_bump_hooks = []
post_package_bump_hooks = []

pre_bump_hooks = [
  "bun build:js",
  "sed -i '' 's/\"version\": \".*\"/\"version\": \"'\"{{version}}\"'\"/g' package.json"
]

post_bump_hooks = [
  "git push origin main --tags"
]

# 2. Configuration Tables (Sections with bracketed headers)
[git_hooks.pre-commit]
script = "cog check"

[git_hooks.commit-msg]
script = "cog verify --file $1"

[commit_types]

[changelog]
authors = [
  { signature = "Ernest Irabor", username = "Irabeny" }
]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "irabeny89"
repository = "js-html-view"

[bump_profiles]
