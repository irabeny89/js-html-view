name: Auto-Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Tests
        run: bun test

      - name: Cocogitto Release
        id: coco
        uses: cocogitto/cocogitto-action@v3
        with:
          check: true
          release: true
          git-user: "github-actions[bot]"
          git-user-email: "github-actions[bot]@no-reply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run your package build script so the dist/ folder actually exists
      - name: Build Distribution Bundle
        if: steps.coco.outputs.version != ''
        run: bun run build:js

      # Archive the repository source code and dist folder into a lightweight tarball
      - name: Package Release Archive
        if: steps.coco.outputs.version != ''
        run: |
          VERSION="${{ steps.coco.outputs.version }}"
          tar -czf "js-html-view-${VERSION}.tar.gz" dist/ package.json README.md LICENSE

      # Calculate SHA256 checksum for the single archive
      - name: Generate Checksum
        if: steps.coco.outputs.version != ''
        id: hash
        run: |
          VERSION="${{ steps.coco.outputs.version }}"
          ARCHIVE_NAME="js-html-view-${VERSION}.tar.gz"
          SHA=$(sha256sum "$ARCHIVE_NAME" | awk '{print $1}')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "$SHA" > checksum.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.coco.outputs.version }}
          files: |
            js-html-view-${{ steps.coco.outputs.version }}.tar.gz
            checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update Homebrew Tap with a Node dependency model
      - name: Update Homebrew Tap Formula
        if: steps.coco.outputs.version != ''
        run: |
          VERSION="${{ steps.coco.outputs.version }}"
          SHA="${{ steps.hash.outputs.sha }}"

          # Configure Git inside runner context
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@no-reply.github.com"

          # Clone your homebrew-tap repository using your personal access token secret
          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/irabeny89/homebrew-tap homebrew-repo

          # Generate a multi-platform Homebrew ruby formula file dynamically
          cat << EOF > homebrew-repo/hv.rb
          class Hv < Formula
            desc "A CLI to generate static HTML from JS/TS template functions and preview them."
            homepage "https://github.com/irabeny89/js-html-view"
            version "${VERSION}"

            url "https://github.com/irabeny89/js-html-view/releases/download/#{version}/js-html-view-#{version}.tar.gz"
            sha256 "${SHA}"

            # Tells Homebrew to ensure Node.js is installed on the user's system
            depends_on "node"

            def install
              # Copy all library assets into homebrew's internal cellar path
              libexec.install Dir["*"]

              # Automatically write an executable symlink wrapper that fires up Node.js
              # This mounts an ultra-light "hv" command globally that calls your script!
              bin.install_symlink libexec/"dist/index.js" => "hv"
            end

            test do
              system "#{bin}/hv", "--help"
            end
          end
          EOF

          # Commit and push changes over to the homebrew-tap repository automatically
          cd homebrew-repo
          git add hv.rb
          git commit -m "chore: bump hv formula to script version ${VERSION}"
          git push origin main
