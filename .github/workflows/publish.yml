name: Auto-Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Tests
        run: bun test

      - name: Cocogitto Release
        id: coco
        uses: cocogitto/cocogitto-action@v3
        with:
          check: true
          release: true
          git-user: "github-actions[bot]"
          git-user-email: "github-actions[bot]@no-reply.github.com"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Standalone Binaries
        run: |
          bun run build:linux-x64
          bun run build:linux-arm64
          bun run build:macos-x64
          bun run build:macos-arm64
          bun run build:windows-x64

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum hv-linux-x64 hv-linux-arm64 hv-darwin-x64 hv-darwin-arm64 hv-windows-x64.exe > checksums.txt
          cat checksums.txt

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.coco.outputs.version }}
          files: |
            dist/hv-linux-x64
            dist/hv-linux-arm64
            dist/hv-darwin-x64
            dist/hv-darwin-arm64
            dist/hv-windows-x64.exe
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ✅ AUTOMATION STEP: Updates your Homebrew Tap repository on every new tag
      - name: Update Homebrew Tap Formula
        if: steps.coco.outputs.version != '' # Only runs if a new version was actually created
        run: |
          VERSION="${{ steps.coco.outputs.version }}"
          
          # Calculate individual SHA256 hashes specifically for the macOS binaries
          SHA_INTEL=$(sha256sum dist/hv-darwin-x64 | awk '{print $1}')
          SHA_ARM=$(sha256sum dist/hv-darwin-arm64 | awk '{print $1}')
          
          # Configure Git inside runner context
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@no-reply.github.com"
          
          # Clone your homebrew-tap repository using your personal access token secret
          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/irabeny89/homebrew-tap homebrew-repo
          
          # Generate a multi-platform Homebrew ruby formula file dynamically
          cat << EOF > homebrew-repo/hv.rb
          class Hv < Formula
            desc "A CLI to generate static HTML from JS/TS template functions and preview them."
            homepage "https://github.com/irabeny89/js-html-view"
            version "${VERSION}"
          
            if Hardware::CPU.arm?
              url "https://github.com/irabeny89/js-html-view/releases/download/#{version}/hv-darwin-arm64"
              sha256 "${SHA_ARM}"
            else
              url "https://github.com/irabeny89/js-html-view/releases/download/#{version}/hv-darwin-x64"
              sha256 "${SHA_INTEL}"
            end
          
            def install
              # Rename the platform binary to standard "hv" on installation
              if Hardware::CPU.arm?
                bin.install "hv-darwin-arm64" => "hv"
              else
                bin.install "hv-darwin-x64" => "hv"
              end
            end
          
            test do
              system "#{bin}/hv", "--help"
            end
          end
          EOF
          
          # Commit and push changes over to the homebrew-tap repository automatically
          cd homebrew-repo
          git add hv.rb
          git commit -m "chore: bump hv formula to version ${VERSION}"
          git push origin main
