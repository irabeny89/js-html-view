name: Auto-Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write  # Required to let the action push the tag and release commit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Pass the token to checkout so downstream git operations are authorized
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Tests
        run: bun test

      - name: Cocogitto Release
        uses: cocogitto/cocogitto-action@v3
        with:
          check: true
          release: true
          git-user: "github-actions[bot]"
          git-user-email: "github-actions[bot]@no-reply.github.com"
        env:
          # Passes auth through to your post_bump_hooks ("git push origin main --tags")
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
